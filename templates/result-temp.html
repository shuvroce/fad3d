<!-- ======= RESULT TEMPLATES ======= -->

<!-- Wind tab content shell -->
<template id="result-wind-tab-template">
    <div class="result__card">
        <div class="result__card-header">
            <h3 class="result__card-title">General Wind</h3>
            <button class="result__card-toggle" aria-label="Toggle section">
                <svg class="result__card-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"></path>
                </svg>
            </button>
        </div>
        <div class="result__card-body" id="wind-general-body">
            <div class="result__item result__empty">Enter wind inputs to calculate</div>
        </div>
    </div>
    <div class="result__card">
        <div class="result__card-header">
            <h3 class="result__card-title">MWFRS</h3>
            <button class="result__card-toggle" aria-label="Toggle section">
                <svg class="result__card-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"></path>
                </svg>
            </button>
        </div>
        <div class="result__card-body" id="wind-mwfrs-body">
            <div class="result__item result__empty">Enter wind inputs to calculate</div>
        </div>
    </div>
    <div class="result__card">
        <div class="result__card-header">
            <h3 class="result__card-title">C&amp;C</h3>
            <button class="result__card-toggle" aria-label="Toggle section">
                <svg class="result__card-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"></path>
                </svg>
            </button>
        </div>
        <div class="result__card-body" id="wind-cladding-body">
            <div class="result__item result__empty">Enter wind inputs to calculate</div>
        </div>
    </div>
</template>

<!-- Facade tab content shell -->
<template id="result-facade-tab-template">
    <div class="result__category-label">
        <span>Category 1</span>
    </div>
    <div class="result__card">
        <div class="result__card-header">
            <h3 class="result__card-title">Glass</h3>
            <button class="result__card-toggle" aria-label="Toggle section">
                <svg class="result__card-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"></path>
                </svg>
            </button>
        </div>
        <div class="result__card-body" id="facade-glass-body">
            <div class="result__item result__empty">Enter glass inputs to calculate</div>
        </div>
    </div>
    <div class="result__card">
        <div class="result__card-header">
            <h3 class="result__card-title">Frame</h3>
            <button class="result__card-toggle" aria-label="Toggle section">
                <svg class="result__card-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"></path>
                </svg>
            </button>
        </div>
        <div class="result__card-body" id="facade-frame-body">
            <div class="result__item result__empty">Enter frame inputs to calculate</div>
        </div>
    </div>
    <div class="result__card">
        <div class="result__card-header">
            <h3 class="result__card-title">Connection</h3>
            <button class="result__card-toggle" aria-label="Toggle section">
                <svg class="result__card-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"></path>
                </svg>
            </button>
        </div>
        <div class="result__card-body" id="facade-conn-body">
            <div class="result__item result__empty">Enter connection inputs to calculate</div>
        </div>
    </div>
    <div class="result__card">
        <div class="result__card-header">
            <h3 class="result__card-title">Anchor</h3>
            <button class="result__card-toggle" aria-label="Toggle section">
                <svg class="result__card-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"></path>
                </svg>
            </button>
        </div>
        <div class="result__card-body" id="facade-anchor-body">
            <div class="result__item result__empty">Enter anchor inputs to calculate</div>
        </div>
    </div>
</template>

<!-- Result row: label + value with optional pass/fail status -->
<template id="result-row-template">
    <div class="result__item">
        <span class="result__label"></span>
        <span class="result__value">
            <span class="result__value-text"></span>
            <span class="result__status" hidden></span>
        </span>
    </div>
</template>

<!-- Section divider -->
<template id="result-divider-template">
    <div class="result__divider"></div>
</template>

<!-- Empty / no-data state -->
<template id="result-empty-template">
    <div class="result__item result__empty"></div>
</template>

<!-- MWFRS table wrapper with header -->
<template id="result-mwfrs-table-template">
    <div class="result__table-wrap">
        <table class="result__table">
            <thead>
                <tr>
                    <th>Lvl</th>
                    <th>H (m)</th>
                    <th>K<sub>z</sub></th>
                    <th>q<sub>z</sub></th>
                    <th>P<sub>zw</sub></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</template>

<!-- Single MWFRS table row -->
<template id="result-mwfrs-row-template">
    <tr>
        <td class="mwfrs-level"></td>
        <td class="mwfrs-height"></td>
        <td class="mwfrs-kz"></td>
        <td class="mwfrs-qz"></td>
        <td class="mwfrs-pzw"></td>
    </tr>
</template>

<!-- C&C cladding table wrapper with header -->
<template id="result-cladding-table-template">
    <div class="result__table-wrap">
        <table class="result__table">
            <thead>
                <tr>
                    <th>Area (m²)</th>
                    <th>P<sub>z4+</sub></th>
                    <th>P<sub>z4-</sub></th>
                    <th>P<sub>z5-</sub></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</template>

<!-- Single C&C cladding table row -->
<template id="result-cladding-row-template">
    <tr>
        <td class="cladding-area"></td>
        <td class="cladding-pz4pos"></td>
        <td class="cladding-pz4neg"></td>
        <td class="cladding-pz5neg"></td>
    </tr>
</template>
