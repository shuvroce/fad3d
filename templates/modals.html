<!-- Error msg modal dialog -->
<dialog id="error-dialog" class="modal__warning">
    <div class="modal__content">
        <div class="modal__warning-icon">⚠️</div>
        <p id="modal__warning-message"></p>
        <button onclick="document.getElementById('error-dialog').close()">
            OK
        </button>
    </div>
</dialog>

<!-- Input Helper Modal -->
<div id="input-helper-modal" class="modal">
    <div class="modal__content">
        <div class="modal__header">
            <h3>Input Guide</h3>
            <span class="modal__close" id="close-input-helper">&times;</span>
        </div>
        <div class="modal__body">
            <div id="input-helper-content">Loading...</div>
        </div>
    </div>
</div>

<!-- Calculator Modal -->
<div id="calculator-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="calculator-title">
    <div class="modal__content-calculator">
        <div class="modal__header">
            <h3 id="calculator-title">Calculator</h3>
            <span class="modal__close" id="close-calculator">&times;</span>
        </div>
        <div class="modal__body">
            <div class="calc">
                <div class="calc__display" id="calc-display" aria-live="polite">
                    0
                </div>
                <div class="calc__keys" id="calc-keys">
                    <button type="button" class="calc__key calc__key-ac" data-key="AC">
                        AC
                    </button>
                    <button type="button" class="calc__key calc__key-del" data-key="DEL">
                        DEL
                    </button>
                    <button type="button" class="calc__key calc__key-op" data-key="(">
                        (
                    </button>
                    <button type="button" class="calc__key calc__key-op" data-key=")">
                        )
                    </button>

                    <button type="button" class="calc__key" data-key="7">
                        7
                    </button>
                    <button type="button" class="calc__key" data-key="8">
                        8
                    </button>
                    <button type="button" class="calc__key" data-key="9">
                        9
                    </button>
                    <button type="button" class="calc__key calc__key-op" data-key="÷">
                        ÷
                    </button>

                    <button type="button" class="calc__key" data-key="4">
                        4
                    </button>
                    <button type="button" class="calc__key" data-key="5">
                        5
                    </button>
                    <button type="button" class="calc__key" data-key="6">
                        6
                    </button>
                    <button type="button" class="calc__key calc__key-op" data-key="×">
                        ×
                    </button>

                    <button type="button" class="calc__key" data-key="1">
                        1
                    </button>
                    <button type="button" class="calc__key" data-key="2">
                        2
                    </button>
                    <button type="button" class="calc__key" data-key="3">
                        3
                    </button>
                    <button type="button" class="calc__key calc__key-op" data-key="-">
                        -
                    </button>

                    <button type="button" class="calc__key" data-key="0">
                        0
                    </button>
                    <button type="button" class="calc__key" data-key=".">
                        .
                    </button>
                    <button type="button" class="calc__key calc__key-eq" data-key="=">
                        =
                    </button>
                    <button type="button" class="calc__key calc__key-op" data-key="+">
                        +
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Glass Chart Modal -->
<div id="glass-chart-modal" class="modal">
    <div class="modal__dialog">
        <div class="modal__header">
            <h2 class="modal__title">Glass Reference Chart</h2>
            <button type="button" class="modal__close" aria-label="Close modal">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="modal__content">
            <img id="glass-chart-image" src="" alt="Glass chart" style="display: none" />
            <div id="glass-chart-loading" style="text-align: center; color: var(--text-secondary)">
                <p>Loading chart...</p>
            </div>
        </div>
    </div>
</div>

<!-- Category Icon Selector Modal -->
<div id="category-icon-modal" class="modal">
    <div class="modal__dialog modal__dialog-small">
        <div class="modal__header">
            <h2 class="modal__title">Select Category Icon</h2>
            <button type="button" class="modal__close" id="close-icon-selector" aria-label="Close modal">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="modal__content">
            <div class="icon-grid" id="icon-grid">
                <!-- Icons will be populated here -->
            </div>
            <div class="modal__footer">
                <button type="button" class="modal__btn modal__btn-secondary" id="remove-category-icon">
                    Remove Icon
                </button>
            </div>
        </div>
    </div>
</div>

<!-- General Settings Modal -->
<div id="general-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="general-modal-title">
    <div class="modal__dialog modal__dialog-large">
        <div class="modal__header">
            <h2 class="modal__title" id="general-modal-title">General Settings</h2>
            <button type="button" class="modal__close" id="close-general-modal" aria-label="Close modal">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="modal__content">
            <div class="modal__form-grid">
                <div class="input__field">
                    <label for="gen-project-name">Project Name</label>
                    <input type="text" id="gen-project-name" placeholder="Enter project name">
                </div>
                <div class="input__field">
                    <label for="gen-project-number">Project Number</label>
                    <input type="text" id="gen-project-number" placeholder="e.g. PRJ-2024-001">
                </div>
                <div class="input__field">
                    <label for="gen-client">Client</label>
                    <input type="text" id="gen-client" placeholder="Enter client name">
                </div>
                <div class="input__field">
                    <label for="gen-location">Site Location</label>
                    <input type="text" id="gen-location" placeholder="Enter site location">
                </div>
                <div class="input__field">
                    <label for="gen-design-code">Design Code</label>
                    <select id="gen-design-code">
                        <option value="">Select code</option>
                        <option value="as4284">AS 4284</option>
                        <option value="en13830">EN 13830</option>
                        <option value="asce7">ASCE 7</option>
                        <option value="nbc">NBC</option>
                    </select>
                </div>
                <div class="input__field">
                    <label for="gen-building-class">Building Class</label>
                    <select id="gen-building-class">
                        <option value="">Select class</option>
                        <option value="I">Class I</option>
                        <option value="II">Class II</option>
                        <option value="III">Class III</option>
                        <option value="IV">Class IV</option>
                    </select>
                </div>
                <div class="input__field">
                    <label for="gen-building-height">Building Height</label>
                    <div class="input__group">
                        <input type="number" id="gen-building-height" placeholder="0.0">
                        <span class="input__unit">m</span>
                    </div>
                </div>
                <div class="input__field">
                    <label for="gen-floor-height">Floor-to-Floor Height</label>
                    <div class="input__group">
                        <input type="number" id="gen-floor-height" placeholder="0.0">
                        <span class="input__unit">m</span>
                    </div>
                </div>
                <div class="input__field modal__form-full">
                    <label for="gen-description">Description</label>
                    <textarea id="gen-description" rows="3" placeholder="Project description or notes..."></textarea>
                </div>
            </div>
        </div>
        <div class="modal__footer">
            <button type="button" class="modal__btn modal__btn-secondary" id="cancel-general-modal">Cancel</button>
            <button type="button" class="modal__btn modal__btn-primary" id="apply-general-modal">Apply</button>
        </div>
    </div>
</div>

<!-- Define Parameters Modal -->
<div id="define-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="define-modal-title">
    <div class="modal__dialog modal__dialog-large">
        <div class="modal__header">
            <h2 class="modal__title" id="define-modal-title">Define Parameters</h2>
            <button type="button" class="modal__close" id="close-define-modal" aria-label="Close modal">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="modal__content">
            <div class="modal__form-section">
                <h3 class="modal__form-section-title">Wind Parameters</h3>
                <div class="modal__form-grid">
                    <div class="input__field">
                        <label for="def-wind-region">Wind Region</label>
                        <select id="def-wind-region">
                            <option value="">Select region</option>
                            <option value="A">Region A</option>
                            <option value="B">Region B</option>
                            <option value="C">Region C</option>
                            <option value="D">Region D</option>
                        </select>
                    </div>
                    <div class="input__field">
                        <label for="def-terrain-cat">Terrain Category</label>
                        <select id="def-terrain-cat">
                            <option value="">Select category</option>
                            <option value="TC1">TC 1</option>
                            <option value="TC2">TC 2</option>
                            <option value="TC2.5">TC 2.5</option>
                            <option value="TC3">TC 3</option>
                        </select>
                    </div>
                    <div class="input__field">
                        <label for="def-design-wind-speed">Design Wind Speed</label>
                        <div class="input__group">
                            <input type="number" id="def-design-wind-speed" placeholder="0.0">
                            <span class="input__unit">m/s</span>
                        </div>
                    </div>
                    <div class="input__field">
                        <label for="def-basic-pressure">Basic Wind Pressure</label>
                        <div class="input__group">
                            <input type="number" id="def-basic-pressure" placeholder="0.00">
                            <span class="input__unit">kPa</span>
                        </div>
                    </div>
                    <div class="input__field">
                        <label for="def-service-pressure">Service Pressure</label>
                        <div class="input__group">
                            <input type="number" id="def-service-pressure" placeholder="0.00">
                            <span class="input__unit">kPa</span>
                        </div>
                    </div>
                    <div class="input__field">
                        <label for="def-ultimate-pressure">Ultimate Pressure</label>
                        <div class="input__group">
                            <input type="number" id="def-ultimate-pressure" placeholder="0.00">
                            <span class="input__unit">kPa</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal__form-section">
                <h3 class="modal__form-section-title">Load Parameters</h3>
                <div class="modal__form-grid">
                    <div class="input__field">
                        <label for="def-load-method">Load Combination Method</label>
                        <select id="def-load-method">
                            <option value="lrfd">LRFD</option>
                            <option value="asd">ASD</option>
                        </select>
                    </div>
                    <div class="input__field">
                        <label for="def-dead-load-factor">Dead Load Factor</label>
                        <input type="number" id="def-dead-load-factor" placeholder="1.2" step="0.1">
                    </div>
                    <div class="input__field">
                        <label for="def-live-load-factor">Live Load Factor</label>
                        <input type="number" id="def-live-load-factor" placeholder="1.5" step="0.1">
                    </div>
                    <div class="input__field">
                        <label for="def-deflection-limit">Deflection Limit (L/n)</label>
                        <input type="number" id="def-deflection-limit" placeholder="175" step="25">
                    </div>
                </div>
            </div>
        </div>
        <div class="modal__footer">
            <button type="button" class="modal__btn modal__btn-secondary" id="cancel-define-modal">Cancel</button>
            <button type="button" class="modal__btn modal__btn-primary" id="apply-define-modal">Apply</button>
        </div>
    </div>
</div>
