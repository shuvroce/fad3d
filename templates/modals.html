<!-- Error msg modal dialog -->
<dialog id="error-dialog" class="modal__warning">
    <div class="modal__content">
        <div class="modal__warning-icon">⚠️</div>
        <p id="modal__warning-message"></p>
        <button onclick="document.getElementById('error-dialog').close()">
            OK
        </button>
    </div>
</dialog>

<!-- Input Helper Modal -->
<div id="input-helper-modal" class="modal">
    <div class="modal__content">
        <div class="modal__header">
            <h3>Input Guide</h3>
            <span class="modal__close" id="close-input-helper">&times;</span>
        </div>
        <div class="modal__body">
            <div id="input-helper-content">Loading...</div>
        </div>
    </div>
</div>

<!-- Calculator Modal -->
<div id="calculator-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="calculator-title">
    <div class="modal__content-calculator">
        <div class="modal__header">
            <h3 id="calculator-title">Calculator</h3>
            <span class="modal__close" id="close-calculator">&times;</span>
        </div>
        <div class="modal__body">
            <div class="calc">
                <div class="calc__display" id="calc-display" aria-live="polite">
                    0
                </div>
                <div class="calc__keys" id="calc-keys">
                    <button type="button" class="calc__key calc__key-ac" data-key="AC">
                        AC
                    </button>
                    <button type="button" class="calc__key calc__key-del" data-key="DEL">
                        DEL
                    </button>
                    <button type="button" class="calc__key calc__key-op" data-key="(">
                        (
                    </button>
                    <button type="button" class="calc__key calc__key-op" data-key=")">
                        )
                    </button>

                    <button type="button" class="calc__key" data-key="7">
                        7
                    </button>
                    <button type="button" class="calc__key" data-key="8">
                        8
                    </button>
                    <button type="button" class="calc__key" data-key="9">
                        9
                    </button>
                    <button type="button" class="calc__key calc__key-op" data-key="÷">
                        ÷
                    </button>

                    <button type="button" class="calc__key" data-key="4">
                        4
                    </button>
                    <button type="button" class="calc__key" data-key="5">
                        5
                    </button>
                    <button type="button" class="calc__key" data-key="6">
                        6
                    </button>
                    <button type="button" class="calc__key calc__key-op" data-key="×">
                        ×
                    </button>

                    <button type="button" class="calc__key" data-key="1">
                        1
                    </button>
                    <button type="button" class="calc__key" data-key="2">
                        2
                    </button>
                    <button type="button" class="calc__key" data-key="3">
                        3
                    </button>
                    <button type="button" class="calc__key calc__key-op" data-key="-">
                        -
                    </button>

                    <button type="button" class="calc__key" data-key="0">
                        0
                    </button>
                    <button type="button" class="calc__key" data-key=".">
                        .
                    </button>
                    <button type="button" class="calc__key calc__key-eq" data-key="=">
                        =
                    </button>
                    <button type="button" class="calc__key calc__key-op" data-key="+">
                        +
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Glass Chart Modal -->
<div id="glass-chart-modal" class="modal">
    <div class="modal__dialog">
        <div class="modal__header">
            <h2 class="modal__title">Glass Reference Chart</h2>
            <button type="button" class="modal__close" aria-label="Close modal">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="modal__content">
            <img id="glass-chart-image" src="" alt="Glass chart" style="display: none" />
            <div id="glass-chart-loading" style="text-align: center; color: var(--text-secondary)">
                <p>Loading chart...</p>
            </div>
        </div>
    </div>
</div>

<!-- Category Icon Selector Modal -->
<div id="category-icon-modal" class="modal">
    <div class="modal__dialog modal__dialog-small">
        <div class="modal__header">
            <h2 class="modal__title">Select Category Icon</h2>
            <button type="button" class="modal__close" id="close-icon-selector" aria-label="Close modal">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="modal__content">
            <div class="icon-grid" id="icon-grid">
                <!-- Icons will be populated here -->
            </div>
            <div class="modal__footer">
                <button type="button" class="modal__btn modal__btn-secondary" id="remove-category-icon">
                    Remove Icon
                </button>
            </div>
        </div>
    </div>
</div>

<!-- General Settings Modal -->
<div id="general-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="general-modal-title">
    <div class="modal__dialog modal__dialog-large">
        <div class="modal__header">
            <h2 class="modal__title" id="general-modal-title">General</h2>
            <button type="button" class="modal__close" id="close-general-modal" aria-label="Close modal">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="modal__content">
            <div class="modal__form-grid">
                <div class="input__field">
                    <label for="gen-project-number">Ref. No.</label>
                    <input type="text" id="gen-project-number" placeholder="e.g. RFA-001/REV-02/AEL/NAVA/2026">
                </div>
                <div class="input__field">
                    <label for="gen-project-name">Project Name</label>
                    <input type="text" id="gen-project-name" placeholder="Enter project name">
                </div>
                <div class="input__field">
                    <label for="gen-project-location">Project Location</label>
                    <input type="text" id="gen-project-location" placeholder="e.g. Dhaka">
                </div>
                <div class="input__field">
                    <label for="gen-client">Project Client</label>
                    <input type="text" id="gen-client" placeholder="Enter client name">
                </div>
                <div class="input__field">
                    <label for="gen-rev">Revision No.</label>
                    <input type="text" id="gen-rev" placeholder="0">
                </div>
                <div class="input__field">
                    <label for="gen-date">Date</label>
                    <input type="text" id="gen-date" placeholder="June 28, 2025">
                </div>
                <div class="input__field modal__form-full">
                    <label for="gen-description">Description</label>
                    <textarea id="gen-description" rows="3" placeholder="Project description or notes..."></textarea>
                </div>
            </div>

            <div class="modal__include-area">
                <p class="modal__include-heading">Include in Report?</p>
                <div class="modal__include-checkbox">
                    <div class="modal__include-checkbox-col">
                        <label class="modal__checkbox-option" for="toc">
                            <input type="checkbox" id="toc" name="include.toc" checked>
                            <span>Table of Contents</span>
                        </label>
                        <label class="modal__checkbox-option" for="intro">
                            <input type="checkbox" id="intro" name="include.intro" checked>
                            <span>Introduction</span>
                        </label>
                        <label class="modal__checkbox-option modal__checkbox-option-sub" for="material-specs">
                            <input type="checkbox" id="material-specs" name="include.material_specs" checked>
                            <span>– Material Specifications</span>
                        </label>
                        <label class="modal__checkbox-option modal__checkbox-option-sub" for="design-consideration">
                            <input type="checkbox" id="design-consideration" name="include.design_consideration"
                                checked>
                            <span>– Design Consideration</span>
                        </label>
                        <label class="modal__checkbox-option modal__checkbox-option-sub" for="idealization">
                            <input type="checkbox" id="idealization" name="include.idealization" checked>
                            <span>– Indealization of Cross-section</span>
                        </label>
                    </div>

                    <div class="modal__include-checkbox-col">
                        <label class="modal__checkbox-option" for="theory">
                            <input type="checkbox" id="theory" name="include.theory" checked>
                            <span>Theoretical Background</span>
                        </label>
                        <label class="modal__checkbox-option" for="moment-capacity">
                            <input type="checkbox" id="moment-capacity" name="include.moment_capacity" checked>
                            <span>Moment Capacity of Profiles</span>
                        </label>
                        <label class="modal__checkbox-option" for="wind-pressure">
                            <input type="checkbox" id="wind-pressure" name="include.wind_pressure" checked>
                            <span>Wind Pressure</span>
                        </label>
                        <label class="modal__checkbox-option" for="categories">
                            <input type="checkbox" id="categories" name="include.categories" checked>
                            <span>Categories</span>
                        </label>
                        <label class="modal__checkbox-option" for="reference">
                            <input type="checkbox" id="reference" name="include.reference" checked>
                            <span>References</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal__footer">
            <button type="button" class="modal__btn modal__btn-secondary" id="cancel-general-modal">Cancel</button>
            <button type="button" class="modal__btn modal__btn-primary" id="apply-general-modal">Apply</button>
        </div>
    </div>
</div>

<!-- Material Definition Modal -->
<div id="material-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="material-modal-title">
    <div class="modal__dialog modal__dialog-large">
        <div class="modal__header">
            <h2 class="modal__title" id="material-modal-title">Material Definitions</h2>
            <button type="button" class="modal__close" id="close-material-modal" aria-label="Close modal">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="modal__content define-modal__layout">
            <div class="define-modal__list-pane">
                <div class="define-modal__toolbar">
                    <button type="button" class="modal__btn modal__btn-secondary" id="add-material-btn">+ Add</button>
                </div>
                <ul class="define-modal__list" id="material-list" aria-label="Materials"></ul>
            </div>
            <div class="define-modal__form-pane">

                <div class="define-modal__form" id="material-form" hidden>
                    <div class="input__field">
                        <label for="mat-name">Name</label>
                        <input type="text" id="mat-name" placeholder="Material name">
                    </div>
                    <div class="input__field">
                        <label for="mat-type">Type</label>
                        <select id="mat-type">
                            <option value="Aluminum">Aluminum</option>
                            <option value="Steel">Steel</option>
                        </select>
                    </div>
                    <div class="input__field">
                        <label for="mat-grade">Grade</label>
                        <select id="mat-grade"><!-- populated by JS --></select>
                    </div>
                    <div class="input__field">
                        <label for="mat-e">Elastic Modulus</label>
                        <div class="input__group">
                            <input type="number" id="mat-e" placeholder="—" min="0" step="any">
                            <span class="input__unit">GPa</span>
                        </div>
                    </div>
                    <div class="input__field">
                        <label for="mat-fy">Yield Strength</label>
                        <div class="input__group">
                            <input type="number" id="mat-fy" placeholder="—" min="0" step="any">
                            <span class="input__unit">MPa</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal__footer">
            <button type="button" class="modal__btn modal__btn-primary" id="apply-material-modal">Apply</button>
        </div>
    </div>
</div>

<!-- Section Definition Modal -->
<div id="section-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="section-modal-title">
    <div class="modal__dialog modal__dialog-large">
        <div class="modal__header">
            <h2 class="modal__title" id="section-modal-title">Section Definitions</h2>
            <button type="button" class="modal__close" id="close-section-modal" aria-label="Close modal">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="modal__content define-modal__layout">
            <div class="define-modal__list-pane">
                <div class="define-modal__toolbar">
                    <button type="button" class="modal__btn modal__btn-secondary" id="add-section-btn">+ Add</button>
                </div>
                <ul class="define-modal__list" id="section-list" aria-label="Sections"></ul>
            </div>
            <div class="define-modal__form-pane">

                <div class="define-modal__form" id="section-form" hidden>
                    <div class="input__field">
                        <label for="sec-name">Name</label>
                        <input type="text" id="sec-name" placeholder="Section name">
                    </div>
                    <div class="input__field">
                        <label for="sec-grade">Grade</label>
                        <select id="sec-grade"><!-- populated from _materials --></select>
                    </div>
                    <div class="input__field" id="sec-profile-type-row">
                        <label for="sec-profile-type">Profile Type</label>
                        <select id="sec-profile-type">
                            <option value="predefined">Pre-defined</option>
                            <option value="stick">Stick</option>
                            <option value="manual">Manual</option>
                        </select>
                    </div>
                    <div class="input__field" id="sec-shape-row">
                        <label for="sec-shape">Shape</label>
                        <select id="sec-shape"><!-- populated by JS --></select>
                    </div>
                    <div class="input__field">
                        <label for="sec-b">Width (B)</label>
                        <div class="input__group">
                            <input type="number" id="sec-b" placeholder="—" min="0" step="any">
                            <span class="input__unit">mm</span>
                        </div>
                    </div>
                    <div class="input__field">
                        <label for="sec-d">Depth (d)</label>
                        <div class="input__group">
                            <input type="number" id="sec-d" placeholder="—" min="0" step="any">
                            <span class="input__unit">mm</span>
                        </div>
                    </div>
                    <div class="input__field">
                        <label for="sec-tf">Flange Thickness (tf)</label>
                        <div class="input__group">
                            <input type="number" id="sec-tf" placeholder="—" min="0" step="any">
                            <span class="input__unit">mm</span>
                        </div>
                    </div>
                    <div class="input__field">
                        <label for="sec-tw">Web Thickness (tw)</label>
                        <div class="input__group">
                            <input type="number" id="sec-tw" placeholder="—" min="0" step="any">
                            <span class="input__unit">mm</span>
                        </div>
                    </div>
                    <div class="input__field">
                        <label for="sec-a">Area (A)</label>
                        <div class="input__group">
                            <input type="number" id="sec-a" placeholder="—" min="0" step="any">
                            <span class="input__unit">mm²</span>
                        </div>
                    </div>
                    <div class="input__field">
                        <label for="sec-ix">Moment of Inertia (Ix)</label>
                        <div class="input__group">
                            <input type="number" id="sec-ix" placeholder="—" min="0" step="any">
                            <span class="input__unit">mm⁴</span>
                        </div>
                    </div>
                    <div class="input__field">
                        <label for="sec-sx">Section Modulus (Sx)</label>
                        <div class="input__group">
                            <input type="number" id="sec-sx" placeholder="—" min="0" step="any">
                            <span class="input__unit">mm³</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal__footer">
            <button type="button" class="modal__btn modal__btn-primary" id="apply-section-modal">Apply</button>
        </div>
    </div>
</div>
