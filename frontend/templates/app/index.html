<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAD - Facade Analysis & Design v2.0</title>
    <link rel="icon" href="/static/assets/fav.png" type="image/png">
    <link rel="stylesheet" href="/static/css/app.css">
    <script type="importmap">
    {
        "imports": {
            "three": "/static/js/three/three.module.js",
            "three/addons/": "/static/js/three/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <header class="topbar" aria-label="Workspace controls">
        <div class="topbar__left">
            <div class="topbar__logo-badge" aria-label="Facade Report" role="img"></div>
            <div class="topbar__header-btn">
                <button class="topbar__icon-btn" type="button" data-title="Dashboard" aria-label="Dashboard"
                    id="dashboard-btn">
                    <!-- Dashboard -->
                    <svg class="topbar__icon" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-dashboard"></use>
                    </svg>
                </button>
                <button class="topbar__icon-btn" type="button" data-title="Load Project" aria-label="Load Project"
                    id="load-btn">
                    <!-- Load Project -->
                    <svg class="topbar__icon" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-load"></use>
                    </svg>
                </button>
                <button class="topbar__icon-btn" type="button" data-title="Download Project"
                    aria-label="Download Project" id="download-btn">
                    <!-- Download Project -->
                    <svg class="topbar__icon" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-download"></use>
                    </svg>
                </button>
            </div>
            <input type="file" id="yaml-file-input" accept=".fad,application/json" hidden />

            <div class="topbar__panel-btn">
                <button class="topbar__btn-mode"><svg class="floating__bar-icon" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-wind"></use>
                    </svg>
                    Wind
                </button>
                <button class="topbar__btn-mode active"><svg class="floating__bar-icon" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-facade"></use>
                    </svg>
                    Facade
                </button>
            </div>

            <div class="topbar__projct-name" id="header-project-name">
                Project Name
            </div>
            <div id="topbar__status-notification" class="topbar__status-notification"></div>
        </div>

        <div class="topbar__right">
            <div class="topbar__license-container">
                <!-- <div>License status:</div> -->
                <div class="topbar__license" aria-label="License status">
                    <span class="topbar__license-dot topbar__license-active" aria-hidden="true"></span>
                    <span class="topabr__license-text">Active</span>
                </div>
            </div>

            <div class="topbar__right-header-btn">
                <div class="topbar__support-wrap" id="support-wrap">
                    <button class="topbar__header-icon-btn" type="button" aria-label="Support" id="support-btn"
                        aria-haspopup="true" aria-expanded="false">
                        <svg class="topbar__icon-svg" aria-hidden="true">
                            <use href="/static/assets/icons.svg#icon-support"></use>
                        </svg>
                        <p>Support</p>
                    </button>
                    <div class="topbar__support-submenu" id="support-submenu" hidden>
                        <button class="topbar__support-submenu-btn" id="feedback-modal-btn">
                            <svg aria-hidden="true">
                                <use href="/static/assets/icons.svg#icon-feedback"></use>
                            </svg>
                            Send Feedback
                        </button>
                        <button class="topbar__support-submenu-btn" id="contact-modal-btn">
                            <svg aria-hidden="true">
                                <use href="/static/assets/icons.svg#icon-contact"></use>
                            </svg>
                            Contact Us
                        </button>
                    </div>
                </div>

                <button class="topbar__header-icon-btn" type="button" aria-label="Help" id="help-btn">
                    <svg class="topbar__icon-svg" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-help"></use>
                    </svg>
                    <p>Help</p>
                </button>

                <button class="topbar__header-icon-btn" type="button" aria-label="Learn" id="">
                    <svg class="topbar__icon-svg" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-learn"></use>
                    </svg>
                    <p>Learn</p>
                </button>

                <button class="topbar__header-icon-btn" type="button" aria-label="Setting" id="settings-btn">
                    <svg class="topbar__icon-svg" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-setting"></use>
                    </svg>
                    <p>Setting</p>
                </button>
            </div>

            <div class="topbar__report-btn-container" id="report-dropdown-container">
                <button class="topbar__btn-report" id="report-btn" type="button" aria-label="Generate Report">
                    Report
                </button>
                <button class="topbar__btn-report-sub" id="report-dropdown-toggle" type="button"
                    aria-label="Report options" aria-expanded="false" aria-haspopup="true">
                    <svg class="topbar__icon-svg report__chevron" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-chevron-down"></use>
                    </svg>
                </button>
                <ul class="report__dropdown" id="report-dropdown" role="menu">
                    <li role="none">
                        <button class="report__dropdown-item" role="menuitem" type="button">
                            Summary Report
                        </button>
                    </li>
                </ul>
            </div>

            <div class="topbar__user-avatar" aria-hidden="true">
                <img src="/static/assets/dp.jpg" alt="User avatar" />
            </div>

            <div class="">
                <button class="theme__toggle" id="theme__toggle" aria-label="Toggle dark mode" data-title="Theme">
                    <svg id="theme-icon-sun" class="theme__icon sun hidden" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-sun"></use>
                    </svg>
                    <svg id="theme-icon-moon" class="theme__icon moon" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-moon"></use>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <section class="floating__bar">
        <div class="floating__bar-left">
            <div class="floating__bar-left-button">
                <button class="floating__bar-btn" id="general-modal-btn">
                    <svg class="floating__bar-icon" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-general"></use>
                    </svg>
                    General
                </button>
                <div class="floating__bar-define-wrap" id="define-wrap">
                    <button class="floating__bar-btn" id="define-modal-btn">
                        <svg class="floating__bar-icon" aria-hidden="true">
                            <use href="/static/assets/icons.svg#icon-define"></use>
                        </svg>
                        Define
                        <svg class="floating__bar-chevron" aria-hidden="true">
                            <use href="/static/assets/icons.svg#icon-chevron-down"></use>
                        </svg>
                    </button>
                    <div class="floating__bar-submenu" id="define-submenu" hidden>
                        <button class="floating__bar-submenu-btn" id="material-modal-btn">
                            <svg class="floating__bar-icon" aria-hidden="true">
                                <use href="/static/assets/icons.svg#icon-material"></use>
                            </svg>
                            Material
                        </button>
                        <div class="floating__bar-submenu-item floating__bar-submenu-item--nested"
                            id="section-submenu-wrap">
                            <button class="floating__bar-submenu-btn floating__bar-submenu-btn--nested"
                                id="section-submenu-trigger">
                                <svg class="floating__bar-icon" aria-hidden="true">
                                    <use href="/static/assets/icons.svg#icon-section"></use>>
                                </svg>
                                Section
                                <svg class="floating__bar-chevron floating__bar-chevron--right" aria-hidden="true">
                                    <use href="/static/assets/icons.svg#icon-chevron-right"></use>
                                </svg>
                            </button>
                            <div class="floating__bar-submenu floating__bar-submenu--nested" id="section-submenu"
                                hidden>
                                <button class="floating__bar-submenu-btn" id="section-alum-btn">
                                    <svg class="floating__bar-icon" aria-hidden="true">
                                        <use href="/static/assets/icons.svg#icon-aluminum"></use>
                                    </svg>
                                    Aluminum
                                </button>
                                <button class="floating__bar-submenu-btn" id="section-steel-btn">
                                    <svg class="floating__bar-icon" aria-hidden="true">
                                        <use href="/static/assets/icons.svg#icon-steel"></use>
                                    </svg>
                                    Steel
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="floating__bar-right">
            <!-- Filter wrap: button + dropdown panel -->
            <div class="filter__wrap" id="filter-wrap">
                <div class="floating__bar-right-view">
                    <button class="floating__bar-btn floating__bar-btn--filter" id="filter-btn" data-title="Filter">
                        <svg class="floating__bar-icon" aria-hidden="true">
                            <use href="/static/assets/icons.svg#icon-setting"></use>
                        </svg>
                    </button>
                </div>
                <div class="filter__panel" id="filter-panel">
                    <!-- Wind direction — shown only in wind mode -->
                    <div class="filter__panel-section" id="filter-wind-section">
                        <div class="filter__panel-label">Wind Direction</div>
                        <fieldset class="filter__panel-dir-grid">
                            <label class="filter__panel-radio">
                                <input type="radio" name="wind-dir" class="wind-dir-radio" value="+X" checked>
                                <span>Wind +X</span>
                            </label>
                            <label class="filter__panel-radio">
                                <input type="radio" name="wind-dir" class="wind-dir-radio" value="-X">
                                <span>Wind −X</span>
                            </label>
                            <label class="filter__panel-radio">
                                <input type="radio" name="wind-dir" class="wind-dir-radio" value="+Y">
                                <span>Wind +Y</span>
                            </label>
                            <label class="filter__panel-radio">
                                <input type="radio" name="wind-dir" class="wind-dir-radio" value="-Y">
                                <span>Wind −Y</span>
                            </label>
                        </fieldset>
                    </div>
                </div>
            </div>
            <div class="floating__bar-right-view" id="view-mode-controls">
                <button class="floating__bar-btn active">
                    <svg class="floating__bar-icon" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-modelview"></use>
                    </svg>
                    Model
                </button>
                <button class="floating__bar-btn">
                    <svg class="floating__bar-icon" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-dc"></use>
                    </svg>
                    DC Ratio
                </button>
                <button class="floating__bar-btn">
                    <svg class="floating__bar-icon" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-deflection"></use>
                    </svg>
                    Deflection
                </button>
            </div>
            <div class="floating__bar-right-view">
                <button class="floating__bar-btn floating__bar-btn--figures" id="figures-btn">
                    <span class="figures__indicator" id="figures-indicator"></span>
                    Figures
                    <svg class="floating__bar-chevron figures__chevron" aria-hidden="true">
                        <use href="/static/assets/icons.svg#icon-chevron-down"></use>
                    </svg>
                </button>
            </div>
            <div class="figure__panel" id="figure-panel">
                <!-- figure status dynamically load here -->
            </div>
        </div>
    </section>

    <section class="left__panel">
        <div class="catbar" aria-label="Categories">
            <div class="catbar__scroll">
                <!-- Category buttons will be dynamically created here -->
            </div>
            <button class="catbar__btn add" id="cat-add" type="button" data-title="Add Category"
                aria-label="Add Category">
                <svg class="catbar__icon" aria-hidden="true">
                    <use href="/static/assets/icons.svg#icon-add"></use>
                </svg>
            </button>
        </div>

        <div class="input__slide-unit">
            <div class="input__box" id="input-container">
                <!-- Categories will be dynamically created here -->
            </div>
            <button class="left__panel-toggle-left" type="button" aria-label="Collapse left panel"
                data-title="Collapse left panel">
                <svg class="panel__toggle-icon" aria-hidden="true">
                    <use href="/static/assets/icons.svg#icon-chevron-left"></use>
                </svg>
            </button>
        </div>
    </section>

    <section class="viewport__container">
        <div id="viewport-3d"></div>
        <div class="wind-zone-legend" id="wind-zone-legend" aria-hidden="true">
            <div class="wind-zone-legend__title">C&amp;C Wind Zones</div>
            <div class="wind-zone-legend__item"><span class="wind-zone-legend__swatch"
                    style="background:#a4bbe0"></span>Zone 5 — Wall Edge</div>
            <div class="wind-zone-legend__item"><span class="wind-zone-legend__swatch"
                    style="background:#f3f5d5"></span>Zone 4 — Wall Mid</div>
            <div class="wind-zone-legend__item"><span class="wind-zone-legend__swatch"
                    style="background:#f59099"></span>Zone 3 — Roof Corner</div>
            <div class="wind-zone-legend__item"><span class="wind-zone-legend__swatch"
                    style="background:#eab8ff"></span>Zone 2 — Roof Edge</div>
            <div class="wind-zone-legend__item"><span class="wind-zone-legend__swatch"
                    style="background:#f3f5d5"></span>Zone 1 — Roof Mid</div>
        </div>
    </section>

    <section class="right__panel">
        <button class="right__panel-toggle-right" type="button" aria-label="Collapse right panel"
            data-title="Collapse right panel">
            <svg class="panel__toggle-icon" aria-hidden="true">
                <use href="/static/assets/icons.svg#icon-chevron-right"></use>
            </svg>
        </button>
        <div class="result__box">
            <h2 class="result__heading">Design Summary</h2>

            <!-- Tab Navigation -->
            <div class="result__tabs">
                <button class="result__tab-btn" data-result-tab="wind">
                    Wind
                </button>
                <button class="result__tab-btn active" data-result-tab="facade">
                    Facade
                </button>
            </div>

            <!-- Wind Tab Content (cards injected from result-wind-tab-template) -->
            <div class="result__tab-content hidden" data-result-tab="wind"></div>

            <!-- Facade Tab Content (cards injected from result-facade-tab-template) -->
            <div class="result__tab-content" data-result-tab="facade"></div>
        </div>
    </section>

    <div id="nav-cube-container">
        <div id="nav-cube-axis"></div>
    </div>
    <div id="nav-cube-wind" class="nav-cube-view"></div>
    <div id="nav-cube-facade" class="nav-cube-view"></div>

    {% include "modals.html" %}
    {% include "inputs.html" %}
    {% include "results.html" %}

    <script type="module" src="/static/js/main.js"></script>
</body>

</html>
