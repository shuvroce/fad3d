<!-- Wind tab content shell -->
<template id="result-wind-tab-template">
    <div class="result__card">
        <div class="result__card-header">
            <h3 class="result__card-title">
                <svg class="result__card-title-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 8h10a4 4 0 1 0 0-4H5"/>
                    <path d="M5 12h13a4 4 0 1 1 0 8H5"/>
                    <line x1="5" y1="8" x2="5" y2="12"/>
                </svg>
                Wind
            </h3>
            <button class="result__card-toggle" aria-label="Toggle section">
                <svg class="result__card-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"></path>
                </svg>
            </button>
        </div>
        <div class="result__card-body-outer">
            <div class="result__card-body" id="wind-body">
                <div class="result__item result__empty">Enter wind inputs to calculate</div>
            </div>
        </div>
    </div>
</template>
